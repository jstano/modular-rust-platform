[package]
name = "stano-seaorm"
version.workspace = true
edition = "2024"
description = "Postgres pool configuration and domain<->entity Mapper<T> trait for SeaORM on the Stano platform"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/stano-seaorm"

[dependencies]
stano-di = { workspace = true }

sea-orm = { version = "1.1.0", features = ["runtime-tokio-rustls", "sqlx-postgres"] }
thiserror = "2"
tracing = "0.1"
opentelemetry = "0.32"
tracing-opentelemetry = "0.33"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-test = "0.2"
tracing-subscriber = "0.3"
opentelemetry_sdk = { version = "0.32", features = ["trace", "testing"] }
