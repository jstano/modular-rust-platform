[package]
name = "stano-launcher"
version.workspace = true
edition = "2024"
description = "App bootstrap for the Stano platform: wires the Axum router, applies the middleware stack, and handles graceful shutdown"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/stano-launcher"

[dependencies]
stano-di           = { workspace = true }
stano-security     = { workspace = true }
stano-axum         = { workspace = true }

tokio          = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
axum           = { version = "0.8.7" }
tower-http     = { version = "0.6", features = [
    "cors", "timeout", "trace", "compression-full",
    "request-id", "catch-panic", "set-header", "limit",
] }

utoipa            = { version = "5" }
utoipa-axum       = { version = "0.2" }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

tracing = "0.1"
anyhow  = "1"

tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "fmt", "json"] }
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "experimental_metrics_custom_reader"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "http-proto", "logs", "metrics", "trace"] }
opentelemetry-appender-tracing = "0.32"
opentelemetry-semantic-conventions = "0.32"
opentelemetry-prometheus = "0.32"
opentelemetry-system-metrics = "0.32"
prometheus = { version = "0.14", default-features = false }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
serde = { version = "1", features = ["derive"] }
