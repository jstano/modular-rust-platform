[package]
name = "stano-axum"
version.workspace = true
edition = "2024"

[dependencies]
stano-common = { workspace = true }
stano-di = { workspace = true }
stano-route-macros = { workspace = true }
stano-security = { workspace = true }
axum = { version = "0.8.7", features = ["multipart"] }
serde = { version = "1", features = ["derive"] }
utoipa = { version = "5", features = ["macros"] }
utoipa-axum = { version = "0.2" }
inventory = "0.3"
tracing = "0.1"
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
matchit = "0.8"
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
anyhow = "1.0"
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
