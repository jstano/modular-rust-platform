[package]
name = "stano-axum"
version = "0.1.0"
edition = "2024"

[dependencies]
stano-common = { path = "../stano-common" }
stano-di = { path = "../stano-di" }
stano-route-macros = { path = "../stano-route-macros" }
stano-security = { path = "../stano-security" }
axum = { version = "0.8.7", features = ["multipart"] }
serde = { version = "1", features = ["derive"] }
utoipa = { version = "5", features = ["macros"] }
utoipa-axum = { version = "0.2" }
inventory = "0.3"
tracing = "0.1"
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
matchit = "0.8"
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
anyhow = "1.0"
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
