[package]
name = "stano-common"
version.workspace = true
edition = "2024"
description = "Shared error types, typed ID macro, and utilities used across the Stano platform"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/stano-common"

[dependencies]
uuid = { version = "1.11.1", features = ["v4", "v7", "serde"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
anyhow = "1.0"
