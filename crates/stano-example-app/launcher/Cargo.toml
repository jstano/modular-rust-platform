[package]
name = "stano-example-app"
version.workspace = true
edition = "2024"
publish = false

[dependencies]
stano-example-persistence    = { path = "../persistence" }
stano-example-migration      = { path = "../migration" }
stano-example-rest-api       = { path = "../rest-api" }
stano-example-security       = { path = "../security" }
stano-di       = { path = "../../stano-di" }
stano-launcher = { path = "../../stano-launcher" }

utoipa-axum = { version = "0.2" }
tokio       = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
anyhow      = "1"

[dev-dependencies]
axum       = { version = "0.8.7" }
tower      = { version = "0.5", features = ["util"] }
serde_json = "1.0"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
