[package]
name = "stano-route-macros"
version.workspace = true
edition = "2024"
description = "Proc macros (#[get]/#[post]/#[put]/#[delete]/#[patch]) that infer OpenAPI metadata from handler signatures and auto-register routes"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/stano-route-macros"

[lib]
proc-macro = true

[dependencies]
quote = "1.0.42"
proc-macro2 = "1.0"
syn = { version = "2.0", features = ["full"] }
proc-macro-crate = "3"

[dev-dependencies]
trybuild = "1"
